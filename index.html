<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f4ed">
  <title>Campus Coffee & Snack Kiosk | POS</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --ink: #242b24;
      --muted: #777d72;
      --cream: #f7f4ed;
      --paper: #fffefa;
      --green: #315d45;
      --green-dark: #244735;
      --mint: #e5eee5;
      --orange: #e58b55;
      --line: #e7e4db;
      --red: #b93838;
      --red-bg: #fff0ed;
      --shadow: 0 12px 32px rgba(44, 56, 42, .08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--cream); color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .app { max-width: 1440px; margin: 0 auto; padding: 28px clamp(16px, 3vw, 42px) 40px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 30px; }
    .brand { display: flex; align-items: center; gap: 13px; }
    .brand-mark { display: grid; place-items: center; width: 48px; height: 48px; border-radius: 16px; color: white; background: var(--green); font-size: 21px; box-shadow: 0 8px 18px #315d4526; }
    .brand h1 { font-size: clamp(18px, 2vw, 24px); letter-spacing: -.7px; margin: 0; }
    .brand p { margin: 4px 0 0; color: var(--muted); font-size: 12px; letter-spacing: .8px; text-transform: uppercase; }
    .open-pill { border: 1px solid #d8e4d8; color: var(--green); background: #edf5ec; padding: 9px 13px; border-radius: 30px; font-size: 12px; font-weight: 700; white-space: nowrap; }
    .open-pill i { font-size: 8px; margin-right: 7px; }
    .welcome { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin: 0 0 25px; }
    .eyebrow { text-transform: uppercase; letter-spacing: 2px; font-size: 11px; font-weight: 800; color: var(--orange); margin: 0 0 8px; }
    .welcome h2 { font-size: clamp(27px, 4vw, 42px); line-height: 1.08; letter-spacing: -1.7px; margin: 0; }
    .welcome h2 span { color: var(--green); }
    .welcome .sub { color: var(--muted); margin: 10px 0 0; font-size: 14px; }
    .date-chip { border: 1px solid var(--line); background: #ffffff9c; border-radius: 13px; padding: 12px 15px; color: var(--muted); font-size: 12px; white-space: nowrap; }
    .date-chip i { color: var(--green); margin-right: 7px; }
    .workspace { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(330px, .9fr); gap: 24px; align-items: start; }
    .panel { background: var(--paper); border: 1px solid #eae7df; border-radius: 21px; padding: 21px; box-shadow: var(--shadow); }
    .side-column { display: grid; gap: 18px; }
    .footer-note { text-align: center; color: #96988d; font-size: 10px; margin-top: 28px; }
    .section-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 0 0 15px; }
    .section-head h3 { font-size: 18px; letter-spacing: -.4px; margin: 0; }
    .section-head p { color: var(--muted); font-size: 12px; margin: 4px 0 0; }
    .count-label { background: var(--mint); color: var(--green); border-radius: 20px; padding: 6px 10px; font-size: 11px; font-weight: 800; white-space: nowrap; }
    .menu-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 15px; }
    .product-card { background: var(--paper); border: 1px solid #eeece4; border-radius: 19px; padding: 13px; box-shadow: 0 3px 12px #252b2410; transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease; display: flex; flex-direction: column; min-width: 0; }
    .product-card:hover { transform: translateY(-5px); box-shadow: var(--shadow); border-color: #d5dfd3; }
    .product-art { min-height: 128px; border-radius: 13px; display: grid; place-items: center; position: relative; overflow: hidden; margin-bottom: 14px; }
    .product-art::before, .product-art::after { content: ""; position: absolute; border-radius: 50%; background: #ffffff38; }
    .product-art::before { width: 125px; height: 125px; top: -45px; right: -25px; }
    .product-art::after { width: 75px; height: 75px; bottom: -35px; left: -10px; }
    .product-art i { font-size: 48px; color: #fff; filter: drop-shadow(0 7px 5px #22222224); position: relative; z-index: 1; transition: transform .25s; }
    .product-card:hover .product-art i { transform: scale(1.08) rotate(-4deg); }
    .art-coffee { background: linear-gradient(140deg, #b77b50, #71452e); }
    .art-latte { background: linear-gradient(140deg, #b7cbb6, #68866c); }
    .art-matcha { background: linear-gradient(140deg, #9fbf76, #547c4b); }
    .art-muffin { background: linear-gradient(140deg, #e5a36c, #b56b42); }
    .art-ensaymada { background: linear-gradient(140deg, #f0c66e, #d18d3d); }
    .art-sandwich { background: linear-gradient(140deg, #b3b77a, #71804a); }
    .product-meta { display: flex; flex-direction: column; flex: 1; }
    .product-meta h4 { font-size: 14px; margin: 0; letter-spacing: -.2px; }
    .product-meta p { color: var(--muted); font-size: 11px; line-height: 1.45; margin: 5px 0 13px; flex: 1; }
    .product-bottom { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .price { color: var(--green); font-weight: 850; font-size: 15px; white-space: nowrap; }
    .add-btn { display: grid; place-items: center; width: 34px; height: 34px; border: 0; border-radius: 11px; color: white; background: var(--green); transition: background .2s, transform .2s; }
    .add-btn:hover { background: var(--green-dark); transform: scale(1.07); }
  </style>

</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark"><i class="fa-solid fa-mug-hot" aria-hidden="true"></i></div>
        <div><h1>Campus Coffee <span style="color:#e58b55">&</span> Snack Kiosk</h1><p>Fresh sips. Happy breaks.</p></div>
      </div>
      <div class="open-pill"><i class="fa-solid fa-circle"></i> KIOSK OPEN</div>
    </header>


   <section aria-labelledby="menuHeading">
        <div class="section-head">
          <div><h3 id="menuHeading">The Menu</h3><p>Made fresh, just for you.</p></div>
          <span class="count-label"><i class="fa-solid fa-sparkles"></i> 6 CAMPUS FAVORITES</span>
        </div>
        <div class="menu-grid" id="menuGrid"></div>
    </section>

    <main class="workspace">
      <section aria-labelledby="menuHeading">
        <div class="section-head">
          <div><h3 id="menuHeading">The Menu</h3><p>Made fresh, just for you.</p></div>
        </div>
        <p>Loading menu items...</p>
      </section>

      <aside class="side-column" aria-label="Order and payment">
        <section class="panel">
          <h3>Your Order</h3>
          <p style="color: var(--muted); font-size: 12px;">Cart is currently empty.</p>
        </section>
      </aside>
    </main>

    <footer class="footer-note">Made with <i class="fa-solid fa-heart" style="color:#d88968"></i> for the campus community · Demo POS for learning purposes</footer>
  </div>
</body>
<script>
    "use strict";

    const products = [
      { id: 1, name: "Espresso", price: 65, description: "Bold, rich & beautifully simple.", icon: "fa-mug-hot", art: "art-coffee" },
      { id: 2, name: "Iced Latte", price: 85, description: "Chilled espresso with creamy milk.", icon: "fa-glass-water", art: "art-latte" },
      { id: 3, name: "Matcha Latte", price: 95, description: "Smooth green tea, softly sweet.", icon: "fa-leaf", art: "art-matcha" },
      { id: 4, name: "Chocolate Muffin", price: 50, description: "A soft, chocolatey little treat.", icon: "fa-cookie-bite", art: "art-muffin" },
      { id: 5, name: "Cheese Ensaymada", price: 40, description: "Fluffy bread with cheesy goodness.", icon: "fa-bread-slice", art: "art-ensaymada" },
      { id: 6, name: "Club Sandwich", price: 75, description: "A hearty bite between classes.", icon: "fa-burger", art: "art-sandwich" }
    ];

    const peso = amount => "₱" + Number(amount).toLocaleString("en-PH", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const menuGrid = document.getElementById("menuGrid");

    function renderMenu() {
      menuGrid.innerHTML = products.map(product => `
        <article class="product-card">
          <div class="product-art ${product.art}" aria-hidden="true"><i class="fa-solid ${product.icon}"></i></div>
          <div class="product-meta">
            <h4>${product.name}</h4>
            <p>${product.description}</p>
            <div class="product-bottom">
              <span class="price">${peso(product.price)}</span>
              <button class="add-btn" type="button" data-add="${product.id}" aria-label="Add ${product.name} to order" title="Add to order"><i class="fa-solid fa-plus"></i></button>
            </div>
          </div>
        </article>
      `).join("");
    }

    renderMenu();
  </script>
</html>
